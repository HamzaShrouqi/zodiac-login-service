# Continuous Integration: on every push and pull request, GitHub builds the project,
# runs all tests, and checks that the Docker image can be built.
# A red ✗ on a commit means something broke; a green ✓ means it is safe to build on.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow may only read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest   # a fresh Linux machine; Docker is preinstalled (Testcontainers needs it)
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Installs Gradle's helper: caches downloaded dependencies between runs to save minutes.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # "build" = compile + run every unit and integration test + package the jar.
      - name: Build and run all tests
        run: ./gradlew build --console=plain

      # Only when something failed: keep the test report so you can read it from the run page.
      - name: Save test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/

  docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-and-test        # only after the tests passed
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Builds the image to prove the Dockerfile works. Nothing is published anywhere (no registry chosen yet).
      - name: Build the image
        run: docker build --tag zodiac-login-service:ci .

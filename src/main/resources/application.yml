# Base configuration shared by every environment (local, review, prod).
# Values that differ per environment are read from environment variables: ${NAME}.
# application-local.yml fills them in for your laptop. Secrets never live in this file.

spring:
  application:
    name: login-service

  datasource:
    # No defaults on purpose: if these are missing, the app refuses to start
    # instead of silently connecting to the wrong database.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Liquibase owns the schema. Hibernate only CHECKS that our Java entities match
      # the tables, and never creates or changes tables itself.
      ddl-auto: validate
    # Close the DB connection when the service layer is done, not at the end of the
    # HTTP request. Avoids hidden, slow queries from controllers.
    open-in-view: false

  liquibase:
    # The master changelog: the table of contents listing every migration in order.
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Our own settings for the login rules. Read by config/AuthProperties.java.
zodiac:
  auth:
    session-ttl: 7d                  # how long a login token stays valid
    max-failed-login-attempts: 5     # wrong passwords in a row before a temporary lock
    lock-duration: 15m               # how long that lock lasts

# API documentation pages (/swagger-ui.html and /v3/api-docs).
# Off by default; application-local.yml turns them on for development.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # Each Zodiac service gets its own port so they can all run side by side locally.
  # Login = 8081. Override with the SERVER_PORT environment variable if needed.
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Expose only what deployment platforms need. Actuator can expose much more
        # (env, beans, heap dumps...), which would leak internals if made public.
        include: health, info

# Settings for running on a developer laptop (profile "local").
# They match docker-compose.yml. This password is not a secret: it only works on your machine.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/login_db
    username: login_user
    password: login_local_pw

  jpa:
    # Print the SQL Hibernate runs, which is useful for learning and debugging. Never in prod.
    show-sql: true

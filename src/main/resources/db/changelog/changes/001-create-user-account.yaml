# One row per person who can log in: customers, shop staff and admins.
# Profile data (name, address, perfume preferences) does NOT live here;
# it will belong to the future Onboarding Service, linked by user_account.id.

databaseChangeLog:
  - changeSet:
      id: 001-create-user-account
      author: hamzashrouqi
      changes:
        - createTable:
            tableName: user_account
            columns:
              - column:
                  # UUID (e.g. 3f2b...-...): hard to guess, and safe to share with other services.
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_account
              - column:
                  # Always stored in lowercase so "Sara@X.com" and "sara@x.com" are the same account.
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_user_account_email
              - column:
                  # Reserved for future phone/OTP login. Empty for now.
                  name: phone
                  type: VARCHAR(20)
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_user_account_phone
              - column:
                  # BCrypt hash, never the real password.
                  name: password_hash
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  # Counts wrong passwords in a row; reset to 0 on a successful login.
                  name: failed_login_attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  # If set and in the future, the account is temporarily locked.
                  name: locked_until
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_login_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  # Optimistic locking: stops two requests from silently overwriting each other.
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      # A safety net in the database itself: even buggy code cannot save an
      # unknown role/status or a non-lowercase email.
      id: 001-user-account-check-constraints
      author: hamzashrouqi
      changes:
        - sql:
            sql: >
              ALTER TABLE user_account
                ADD CONSTRAINT ck_user_account_role   CHECK (role IN ('CUSTOMER', 'STAFF', 'ADMIN')),
                ADD CONSTRAINT ck_user_account_status CHECK (status IN ('ACTIVE', 'LOCKED', 'DISABLED')),
                ADD CONSTRAINT ck_user_account_email_lowercase CHECK (email = LOWER(email)),
                ADD CONSTRAINT ck_user_account_failed_attempts CHECK (failed_login_attempts >= 0);
      rollback:
        - sql:
            sql: >
              ALTER TABLE user_account
                DROP CONSTRAINT ck_user_account_role,
                DROP CONSTRAINT ck_user_account_status,
                DROP CONSTRAINT ck_user_account_email_lowercase,
                DROP CONSTRAINT ck_user_account_failed_attempts;

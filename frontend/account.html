<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account · Zodiac</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<!-- "is-loading" hides the page until we know the user is really logged in (see account.js) -->
<body class="is-loading">
  <main class="card">
    <header class="brand">
      <span class="brand__mark" aria-hidden="true">✦</span>
      <h1 class="brand__name">Zodiac</h1>
    </header>

    <h2 id="welcome">Welcome</h2>
    <div id="details" class="details"></div>

    <hr>

    <h3>Change password</h3>
    <div id="password-message" class="message" role="alert" aria-live="polite" hidden></div>

    <form id="password-form" novalidate>
      <div class="field">
        <label for="currentPassword">Current password</label>
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
        <p class="field__error" data-error-for="currentPassword"></p>
      </div>

      <div class="field">
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
        <p class="field__hint">At least 8 characters.</p>
        <p class="field__error" data-error-for="newPassword"></p>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        <p class="field__error" data-error-for="confirmPassword"></p>
      </div>

      <button type="submit" data-busy-text="Saving…">Change password</button>
    </form>

    <hr>

    <button id="logout-button" type="button" class="button--secondary">Log out</button>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/account.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Zodiac</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="card">
    <header class="brand">
      <span class="brand__mark" aria-hidden="true">✦</span>
      <h1 class="brand__name">Zodiac</h1>
      <p class="brand__tagline">Perfumes · Beauty · Gifts</p>
    </header>

    <h2>Log in</h2>

    <!-- aria-live: screen readers announce messages when they appear -->
    <div id="message" class="message" role="alert" aria-live="polite" hidden></div>

    <!-- novalidate: we show our own friendly messages instead of the browser's pop-ups -->
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        <p class="field__error" data-error-for="email"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="field__error" data-error-for="password"></p>
      </div>

      <button type="submit" data-busy-text="Logging in…">Log in</button>
    </form>

    <p class="alt">New to Zodiac? <a href="register.html">Create an account</a></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
